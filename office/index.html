<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#30343b">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>GPBS Storage — Storage Management</title>
  <link rel="icon" href="/icons/app-icon-192.png">
  <link rel="stylesheet" href="./office.css?v=4">
  <!-- Critical login layout: bundled here to avoid stale stylesheet deployments. -->
  <style>
    #loginScreen .login-shell {
      width:100%;max-width:none;min-height:100dvh;
      margin:0;padding:28px clamp(24px,4.2vw,80px) 22px;
      display:flex;flex-direction:column;
    }
    #loginScreen .login-brand{
      width:100%;margin:0;padding:0 0 22px;
      display:flex;align-items:center;justify-content:space-between;
      flex-wrap:nowrap;gap:30px;
      border-bottom:1px solid rgba(255,255,255,.15);
    }
    #loginScreen .login-brand-lockup {
      display:flex;align-items:center;flex-direction:row;
      flex:0 1 auto;min-width:0;gap:clamp(14px,2vw,32px);
    }
    #loginScreen .login-brand-lockup img{
      display:block;flex:none;
      width:clamp(205px,18vw,330px);
      height:auto;max-height:none;object-fit:contain;
    }
    #loginScreen .login-brand-name{
      display:flex;flex-direction:column;flex:0 1 auto;
      min-width:0;gap:5px;
    }
    #loginScreen .login-brand-name strong{
      font-size:clamp(24px,2.2vw,33px);line-height:1.05;
      font-weight:850;letter-spacing:2px;color:#fff;
    }
    #loginScreen .login-brand-name span{
      font-size:clamp(10px,.9vw,13px);font-weight:750;
      letter-spacing:1.4px;color:#cbd2dc;
      white-space:normal;
    }
    #loginScreen .polish-flag{
      display:flex;align-items:center;justify-content:center;
      flex:0 0 clamp(120px,10vw,180px);
      height:clamp(72px,6vw,110px);
      perspective:550px;
      filter:drop-shadow(0 7px 15px rgba(0,0,0,.38));
    }
    #loginScreen .flag-cloth{
      width:100%;height:100%;position:relative;overflow:hidden;
      display:flex;flex-direction:column;
      border-radius:3px 8px 8px 3px;
      transform-origin:15% 50%;
      animation:office-flag-breeze 5.5s ease-in-out infinite;
    }
    #loginScreen .flag-white,#loginScreen .flag-red{
      display:block;width:100%;height:50%;flex:1;
    }
    #loginScreen .flag-white{background:#fff}
    #loginScreen .flag-red{background:#d91f34}
    #loginScreen .flag-cloth::after{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(105deg,rgba(20,20,20,.16),transparent 25%,rgba(12,12,12,.19) 40%,rgba(255,255,255,.15) 58%,rgba(30,30,30,.14) 78%,transparent);
      background-size:190% 100%;
      animation:office-flag-shimmer 5.5s ease-in-out infinite;
    }
    @keyframes office-flag-breeze{
      0%,100%{transform:rotateY(-7deg) skewY(.6deg) scaleX(.987)}
      50%{transform:rotateY(5deg) skewY(-.7deg) scaleX(.994)}
    }
    @keyframes office-flag-shimmer{
      0%,100%{background-position:10% 0}
      50%{background-position:90% 0}
    }
    #loginScreen .login-card{
      width:min(100%,475px);max-width:475px;
      margin:clamp(54px,10dvh,110px) auto 32px;
      padding:0;background:transparent;border:0;box-shadow:none;
    }
    #loginScreen .login-card input{
      appearance:none;background:#182029 !important;
      background-color:#182029 !important;
      color:#f4f7fa !important;
      border:1px solid #56616f !important;
      border-radius:13px;
      -webkit-text-fill-color:#f4f7fa !important;
      box-shadow:inset 0 2px 10px rgba(0,0,0,.25) !important;
    }
    #loginScreen .login-card input:autofill,
    #loginScreen .login-card input:-webkit-autofill{
      background:#182029 !important;
      -webkit-box-shadow:0 0 0 1000px #182029 inset !important;
      box-shadow:0 0 0 1000px #182029 inset !important;
      -webkit-text-fill-color:#f4f7fa !important;
    }
    @media(max-width:760px){
      #loginScreen .login-shell{padding:21px 19px}
      #loginScreen .login-brand{gap:12px}
      #loginScreen .login-brand-lockup{gap:9px}
      #loginScreen .login-brand-lockup img{width:clamp(110px,24vw,175px)}
      #loginScreen .login-brand-name strong{font-size:clamp(17px,3.2vw,24px)}
      #loginScreen .login-brand-name span{font-size:9px;letter-spacing:.5px}
      #loginScreen .polish-flag{flex-basis:88px;height:55px}
    }
    @media(max-width:480px){
      #loginScreen .login-brand{gap:8px}
      #loginScreen .login-brand-lockup img{width:clamp(83px,24vw,113px)}
      #loginScreen .login-brand-name strong{font-size:17px;letter-spacing:.7px}
      #loginScreen .login-brand-name span{font-size:8px;letter-spacing:.1px}
      #loginScreen .polish-flag{flex-basis:58px;height:37px}
    }
    @media(prefers-reduced-motion:reduce){
      #loginScreen .flag-cloth,#loginScreen .flag-cloth::after{animation:none}
    }
  </style>
  <script defer src="./office.js?v=1"></script>
</head>
<body>
  <section id="loginScreen" class="login-screen" aria-labelledby="loginTitle">
    <div class="login-shell">
      <header class="login-brand">
        <div class="login-brand-lockup">
          <img src="/icons/gpbs-logo.svg" alt="GPBS">
          <div class="login-brand-name">
            <strong>STORAGE</strong>
            <span>STORAGE MANAGEMENT / POLSKA</span>
          </div>
        </div>
        <div class="polish-flag" role="img" aria-label="Flaga Polski">
          <div class="flag-cloth" aria-hidden="true">
            <span class="flag-white"></span>
            <span class="flag-red"></span>
          </div>
        </div>
      </header>
      <div class="login-card">
        <div class="kicker">LOGOWANIE</div>
        <h1 id="loginTitle">Zaloguj się</h1>
        <p>Wpisz swój 4-cyfrowy PIN.</p>
        <form id="loginForm">
          <label for="pin">PIN użytkownika</label>
          <input id="pin" type="password" inputmode="numeric" maxlength="4" minlength="4" pattern="[0-9]{4}" autocomplete="off" required placeholder="••••">
          <button class="primary" id="loginButton" type="submit">Zaloguj <span aria-hidden="true">→</span></button>
        </form>
        <p id="loginError" class="error hidden" role="alert"></p>
      </div>
      <footer class="login-foot">GPBS STORAGE <span aria-hidden="true">•</span> SYSTEM MAGAZYNOWY</footer>
    </div>
  </section>
  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><img class="sidebar-logo" src="/icons/gpbs-logo.svg" alt="GPBS"><span class="sidebar-brand-name"><strong>STORAGE</strong><small>STORAGE MANAGEMENT</small></span></div>
      <div class="nav-label">NAWIGACJA</div>
      <nav aria-label="Menu główne">
        <button id="warehouseToggle" class="nav-heading" type="button" aria-expanded="true">
          <span class="nav-icon">▣</span><span>Magazyny</span><span class="chevron">⌄</span>
        </button>
        <div id="warehouseMenu" class="subnav"></div>
        <div class="nav-divider"></div>
        <button type="button" class="nav-item" data-view="pz"><span class="nav-icon">↓</span>Przyjęcia</button>
        <button type="button" class="nav-item" data-view="wz"><span class="nav-icon">↑</span>Wydania</button>
        <button type="button" class="nav-item" data-view="inventories"><span class="nav-icon">☷</span>Inwentaryzacje</button>
        <button type="button" class="nav-item" data-view="vehicles"><span class="nav-icon">▤</span>Stany samochodowe</button>
      </nav>
      <div class="side-footer">
        <div><strong id="username">Użytkownik</strong><small id="userRole">—</small></div>
        <button type="button" id="logout" class="icon-btn light-on-dark" title="Wyloguj" aria-label="Wyloguj">↗</button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="mobileMenu" aria-label="Pokaż menu">☰</button>
        <div class="breadcrumbs">GPBS Storage <span>/</span> <strong id="crumb">Stany magazynowe</strong></div>
        <div class="top-status"><span class="status-dot"></span><span>D1</span></div>
      </header>
      <div class="content">
        <div class="page-head">
          <div>
            <div class="kicker" id="pageKicker">MAGAZYN TYCHY</div>
            <h1 id="pageTitle">Stany magazynowe</h1>
            <p id="pageDesc">Aktualny podgląd części.</p>
          </div>
          <div class="page-actions">
            <span class="sync-label" id="syncTime"></span>
            <button type="button" class="btn outline" id="refresh" title="Odśwież dane">↻ <span>Synchronizuj</span></button>
            <button type="button" class="btn dark" id="newPart" disabled title="Dostępne w kolejnym etapie">+ Dodaj część</button>
          </div>
        </div>
        <div id="errorBanner" class="error-banner hidden" role="alert"></div>
        <div id="testBanner" class="test-banner hidden"></div>
        <section class="table-card" aria-label="Dane">
          <div class="table-toolbar">
            <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" autocomplete="off" aria-label="Szukaj" placeholder="Szukaj po SAP lub nazwie części"></div>
            <div class="tools-right">
              <button class="btn subtle" id="sort" type="button">Nazwa A–Z</button>
              <button class="btn subtle" id="export" type="button" disabled title="Eksport Excel przygotujemy w kolejnym etapie">⇩ Eksport</button>
            </div>
          </div>
          <div id="searchNote" class="search-note hidden"></div>
          <div class="table-scroll" id="tableArea"><div class="loading">Wczytywanie danych...</div></div>
          <div id="tableFooter" class="table-footer"></div>
        </section>
      </div>
    </div>
  </div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal-card">
      <button type="button" id="modalClose" class="modal-close" aria-label="Zamknij">×</button>
      <div id="modalBody"></div>
    </div>
  </div>
</body>
</html>
