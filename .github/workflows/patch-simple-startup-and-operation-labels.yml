name: Patch simple startup and operation labels

on:
  push:
    paths:
      - '.github/workflows/patch-simple-startup-and-operation-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 tools/patch_remove_custom_splash_and_rename_operation_action.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/warehouse.css js/operation-flow.js js/runtime-fixes.js js/app.js js/auth.js service-worker.js
          git commit -m "Restore quick startup and simplify operation action"
          git push
