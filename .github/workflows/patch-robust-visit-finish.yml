name: Fix finish retry guard

on:
  push:
    paths:
      - '.github/workflows/patch-robust-visit-finish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply retry fix
        run: python3 .github/scripts/fix_finish_retry.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/offline.js service-worker.js
          git commit -m "Keep retrying pending visit finish"
          git push
