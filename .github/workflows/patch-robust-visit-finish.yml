name: Update operation button label

on:
  push:
    paths:
      - '.github/workflows/patch-robust-visit-finish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update operation button
        run: python3 .github/scripts/patch_operation_button_label.py

      - name: Commit label update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/operation-flow.js index.html service-worker.js
          git commit -m "Simplify operation action label"
          git push
