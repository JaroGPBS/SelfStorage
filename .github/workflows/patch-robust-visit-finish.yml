name: Fix quantity modal keyboard

on:
  push:
    paths:
      - '.github/workflows/patch-robust-visit-finish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch quantity modal
        run: python3 .github/scripts/patch_quantity_keyboard.py

      - name: Commit keyboard fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js css/app.css service-worker.js
          git commit -m "Keep quantity dialog above Android keyboard"
          git push
