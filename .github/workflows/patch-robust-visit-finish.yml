name: Patch robust visit finish

on:
  push:
    paths:
      - '.github/workflows/patch-robust-visit-finish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch visit finish flow
        run: python3 .github/scripts/patch_robust_visit_finish.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/offline.js js/app.js service-worker.js
          git commit -m "Make visit finishing resilient after sleep and offline"
          git push
