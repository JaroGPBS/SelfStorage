name: Remove success toasts

on:
  push:
    paths:
      - '.github/workflows/patch-robust-visit-finish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove success toasts
        run: python3 .github/scripts/patch_remove_success_toasts.py

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/operation-flow.js js/offline.js service-worker.js
          git commit -m "Remove nonessential success toasts"
          git push
