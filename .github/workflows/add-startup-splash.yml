name: Add startup splash

on:
  push:
    paths:
      - '.github/workflows/add-startup-splash.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add GPBS Storage startup splash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text()

          style_marker = '  <style>\n'
          splash_css = '''  <style>\n    #startupSplash {\n      position: fixed;\n      inset: 0;\n      z-index: 99999;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));\n      background: #20242a;\n      opacity: 1;\n      visibility: visible;\n      transition: opacity .3s ease, visibility 0s linear .3s;\n      pointer-events: all;\n    }\n\n    #startupSplash.startup-splash-hide {\n      opacity: 0;\n      visibility: hidden;\n      pointer-events: none;\n    }\n\n    #startupSplash img {\n      display: block;\n      width: min(58vw, 240px);\n      height: auto;\n      max-width: 240px;\n      max-height: 58vh;\n      object-fit: contain;\n    }\n\n'''

          if '#startupSplash {' not in s:
              if style_marker not in s:
                  raise SystemExit('Nie znaleziono znacznika <style> w index.html')
              s = s.replace(style_marker, splash_css, 1)

          body_marker = '<body>\n'
          splash_html = '''<body>\n  <div id="startupSplash" aria-hidden="true">\n    <img src="./icons/app-icon-512.png?v=6" alt="">\n  </div>\n'''

          if 'id="startupSplash"' not in s:
              if body_marker not in s:
                  raise SystemExit('Nie znaleziono <body> w index.html')
              s = s.replace(body_marker, splash_html, 1)

          script_marker = '</body>'
          splash_script = '''  <script>\n    (() => {\n      const startedAt = performance.now();\n      const MIN_SPLASH_MS = 2000;\n      const splash = document.getElementById('startupSplash');\n      if (!splash) return;\n\n      const hideSplash = () => {\n        const elapsed = performance.now() - startedAt;\n        const wait = Math.max(0, MIN_SPLASH_MS - elapsed);\n        window.setTimeout(() => {\n          splash.classList.add('startup-splash-hide');\n          window.setTimeout(() => splash.remove(), 350);\n        }, wait);\n      };\n\n      if (document.readyState === 'complete') {\n        hideSplash();\n      } else {\n        window.addEventListener('load', hideSplash, { once: true });\n      }\n    })();\n  </script>\n</body>'''

          if 'MIN_SPLASH_MS = 2000' not in s:
              if script_marker not in s:
                  raise SystemExit('Nie znaleziono </body> w index.html')
              s = s.replace(script_marker, splash_script, 1)

          index.write_text(s)

          sw = Path('service-worker.js')
          w = sw.read_text()
          w = w.replace("selfstorage-shell-v68", "selfstorage-shell-v69")
          sw.write_text(w)
          PY

      - name: Commit splash screen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Add 2 second GPBS Storage startup splash"
          git push
