name: Fix PWA splash transition

on:
  push:
    paths:
      - '.github/workflows/fix-pwa-splash-transition.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply PWA splash transition patch
        run: python3 tools/fix_pwa_splash_transition.py

      - name: Commit PWA splash transition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/warehouse.css js/auth.js service-worker.js
          git commit -m "Smooth installed PWA splash transition"
          git push
