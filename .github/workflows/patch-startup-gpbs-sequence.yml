name: Patch startup GPBS sequence

on:
  push:
    paths:
      - '.github/workflows/patch-startup-gpbs-sequence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply startup sequence patch
        run: python3 tools/patch_startup_gpbs_sequence.py

      - name: Commit startup sequence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/warehouse.css js/auth.js service-worker.js
          git commit -m "Refine startup splash transition"
          git push
