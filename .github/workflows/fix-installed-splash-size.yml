name: Fix installed PWA splash size

on:
  push:
    paths:
      - '.github/workflows/fix-installed-splash-size.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply installed splash size patch
        run: python3 tools/fix_installed_splash_size.py

      - name: Commit splash size fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/warehouse.css js/auth.js service-worker.js
          git commit -m "Match installed PWA splash icon size to Android"
          git push
