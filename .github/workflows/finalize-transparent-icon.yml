name: Finalize transparent PWA icon

on:
  push:
    paths:
      - '.github/workflows/finalize-transparent-icon.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make existing icon transparent outside tile
        run: |
          set -e

          if command -v magick >/dev/null 2>&1; then
            IMG='magick'
          elif command -v convert >/dev/null 2>&1; then
            IMG='convert'
          else
            sudo apt-get update
            sudo apt-get install -y imagemagick
            IMG='convert'
          fi

          cp icons/app-icon-512.png /tmp/icon-source.png

          $IMG /tmp/icon-source.png \
            -alpha on \
            -fuzz 12% \
            -fill none \
            -draw 'matte 0,0 floodfill' \
            /tmp/icon-transparent.png

          $IMG /tmp/icon-transparent.png -background none -resize 512x512 icons/app-icon-512.png
          $IMG /tmp/icon-transparent.png -background none -resize 192x192 icons/app-icon-192.png

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('manifest.webmanifest')
          m = manifest.read_text()
          m = m.replace('app-icon-192.png?v=5', 'app-icon-192.png?v=6')
          m = m.replace('app-icon-512.png?v=5', 'app-icon-512.png?v=6')
          manifest.write_text(m)

          index = Path('index.html')
          s = index.read_text()
          s = s.replace('app-icon-192.png?v=2', 'app-icon-192.png?v=6')
          index.write_text(s)

          sw = Path('service-worker.js')
          s = sw.read_text()
          s = s.replace("selfstorage-shell-v67", "selfstorage-shell-v68")
          s = s.replace('app-icon-192.png?v=2', 'app-icon-192.png?v=6')
          s = s.replace('app-icon-512.png?v=2', 'app-icon-512.png?v=6')
          sw.write_text(s)
          PY

          rm -f .tmp/icon_exact_*.b64

      - name: Commit icon update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/app-icon-192.png icons/app-icon-512.png manifest.webmanifest index.html service-worker.js .tmp
          git commit -m "Use transparent GPBS Storage icon"
          git push
