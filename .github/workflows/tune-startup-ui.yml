name: Tune startup UI

on:
  push:
    paths:
      - '.github/workflows/tune-startup-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply startup UI patch
        run: python3 tools/tune_startup_ui.py

      - name: Commit startup UI tune
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/warehouse.css js/runtime-fixes.js js/auth.js service-worker.js
          git commit -m "Stabilize splash and lock portrait orientation"
          git push
